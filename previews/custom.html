<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Custom AI Build</title>
</head>

<body>
    <style>
        #loader {
            font-family: sans-serif;
            text-align: center;
            margin-top: 20vh;
        }
    </style>
    <div id="loader">
        <h2>Loading your Custom AI Build...</h2>
        <p>If you see this, the code hasn't rendered yet.</p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const nodeId = params.get('id');
            const apiBase = 'http://localhost:4000/api/public/sites/';

            const renderHtml = (html) => {
                if (!html) return false;
                document.documentElement.innerHTML = html;
                const scripts = document.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
                return true;
            };

            const showError = (msg) => {
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.innerHTML = `<h2 style="color: #ef4444;">Build Retrieval Error</h2><p>${msg}</p>`;
                }
            };

            if (nodeId) {
                fetch(apiBase + nodeId)
                    .then(res => res.json())
                    .then(data => {
                        if (data.html) {
                            renderHtml(data.html);
                        } else {
                            showError("Site found but contains no build artifact yet.");
                        }
                    })
                    .catch(err => {
                        console.error("Fetch failed, trying local fallback", err);
                        if (!renderHtml(localStorage.getItem('custom_build_html'))) {
                            showError("Could not connect to backend and no local build found.");
                        }
                    });
            } else {
                if (!renderHtml(localStorage.getItem('custom_build_html'))) {
                    showError("No ID provided and no local build found.");
                }
            }
        });
    </script>
</body>

</html>
